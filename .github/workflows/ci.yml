name: InstaStudio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: TypeScript, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
